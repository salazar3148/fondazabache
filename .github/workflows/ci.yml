name: CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: app

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 1 · el contenido de la carta es válido (docs/06)
      - run: pnpm content:check

      # 2 · tipos + lint de JS/TS y CSS
      - run: pnpm lint

      # 3 · formato
      - run: pnpm format:check

      # 4 · compila y exporta
      - run: pnpm build
